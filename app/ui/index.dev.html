<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PicScanner</title>
  <link rel="stylesheet" href="assets/style.css?v=fix6-20260901" />
  <link rel="stylesheet" href="assets/settings.css?v=fix6-20260901" />
  <link rel="stylesheet" href="assets/source_conflicts.css?v=source-id-discovery-20260716-1" />
  <link rel="stylesheet" href="assets/batch_processing.css?v=selected-frame-zindex-1" />
  <link rel="stylesheet" href="assets/collections.css?v=fix6-20260901" />
  <link rel="stylesheet" href="assets/vue/picscanner-frontend.css?v=fix6-20260901" />
</head>
<body>
  <div id="app">
    <!-- P3：来源首页整体由 Vue 渲染（islands/SourceScreen.vue），直接挂载到本元素上。
         #source-screen 是 display:grid + place-items:center，只有一个子项位，
         真正的两列布局在组件根节点的 .source-layout 上，所以组件是单根（与统计屏/设置屏相反）。
         外层容器仍由 legacy 的 showSourceChooser / 显隐逻辑控制 entering / hidden。 -->
    <section id="source-screen" class="source-screen" aria-label="来源首页"></section>

    <main id="workspace" class="workspace hidden">
      <aside class="side">
        <div class="brand-block">
          <div id="current-source" class="side-path"></div>
        </div>
        <div id="progress-card" class="progress-card">
          <div id="scan-block" class="progress-block">
            <div class="progress-top">
              <span id="scan-status" class="progress-label">等待扫描</span>
              <button id="scan-all" class="ghost-btn task-btn">扫描所有图片</button>
            </div>
            <div class="progress-meter">
              <div class="progress-track"><div id="progress-bar"></div></div>
              <span id="scan-count" class="progress-count">0 / 0</span>
            </div>
            <div id="scan-message" class="progress-msg"></div>
          </div>
          <div id="exif-block" class="progress-block">
            <div class="progress-top">
              <span id="exif-status" class="progress-label">等待 EXIF</span>
              <button id="read-exif" class="ghost-btn task-btn">读取 EXIF 统计</button>
            </div>
            <div class="progress-meter">
              <div class="progress-track"><div id="exif-progress-bar"></div></div>
              <span id="exif-count" class="progress-count">0 / 0</span>
            </div>
            <div id="exif-message" class="progress-msg"></div>
          </div>
        </div>
        <div class="category-panel" id="vanilla-category-panel">
          <div class="category-head">
            <div class="section-title">分类</div>
            <button id="add-category" class="icon-btn category-add" title="新增分类" aria-label="新增分类"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 1.75v8.5M1.75 6h8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
          </div>
          <div id="category-list" class="category-list"></div>
        </div>
        <div class="category-panel hidden" id="vue-category-panel" aria-label="分类（Vue）"></div>
      </aside>

      <section class="gallery-wrap">
        <!-- P4：vanilla 工具栏已删除（vue_toolbar 常开，它本来就不可达）。
             留着它才是 #sort-dropdown 重复 id 的根源 —— getElementById
             只会命中文档里第一个，于是"点在下拉外"的判定指向了错误节点。
             Vue 工具栏（#vue-toolbar）是唯一实现。 -->
        <div id="vue-toolbar" aria-label="工具栏（Vue）"></div>
        <!-- P4 收口：legacy 画廊容器（#gallery-scroll/#gallery/#older-sentinel）
             已随引擎链删除。画廊唯一实现是 Vue PhotoGrid（下方 #vue-photogrid）：
             滚动容器 + 两级 windowing，日期分页由滚动驱动 PS.loadOlderDates；
             vue_photogrid=0 时画廊为空（无 legacy 回退）。 -->
        <!-- 挂载契约：#vue-photogrid 必须带 .gallery-scroll —— PhotoGrid 组件根
             节点是 display:contents，画布直接成为本元素的布局子项。
             .photogrid-scroller 禁用浏览器滚动锚定（islands-shared.css），
             否则 windowing 更新 canvas 高度时 scroll anchoring 会掰动
             scrollTop，表现为视图瞬移/弹回。 -->
        <div id="vue-photogrid" class="gallery-scroll photogrid-scroller" aria-label="照片墙（Vue）"></div>
      </section>

      <nav class="date-rail" id="vanilla-date-rail">
        <div class="section-title">日期</div>
        <div id="date-rail-list" class="date-rail-list"></div>
      </nav>
      <nav class="date-rail hidden" id="vue-date-rail" aria-label="日期（Vue）"></nav>

      <!-- P3：集锦列表屏由 Vue 渲染（islands/CollectionsScreen.vue），直接挂载到本元素上。
           .collections-screen 是 flex column，组件的 .collections-topbar(flex:none)
           与 .collections-scroll(flex:1) 必须成为它的直接子项。
           外层容器仍由 legacy 的 openScreen / closeScreen 控制 entering / leaving / hidden。
           注意：集锦详情屏（下方 #collection-detail-screen）仍是 legacy，本轮不动。 -->
      <section id="collections-screen" class="collections-screen hidden" aria-label="集锦"></section>

      <!-- P3：集锦详情屏由 Vue 渲染（islands/CollectionDetailScreen.vue），直接挂载到本元素上。
           .collection-detail-screen 是 flex column，组件的 .collection-detail-topbar(flex:none)
           与 .collection-detail-scroll(flex:1) 必须成为它的直接子项 ——
           .entering 动画也是直接作用在它们俩上的。
           外层容器仍由 legacy 的 openCollectionDetail / closeCollectionDetail 控制
           entering / leaving / hidden。 -->
      <section id="collection-detail-screen" class="collection-detail-screen hidden" aria-label="集锦详情"></section>

      <!-- P3：设置屏整体由 Vue 渲染（islands/SettingsScreen.vue），直接挂载到本元素上。
           .settings-screen 是 flex column，组件的多根节点 .settings-topbar(flex:none)
           与 .settings-scroll(flex:1) 必须成为它的直接子项，中间不能多包一层 div。
           外层容器仍由 legacy 的 openSettingsPage / closeSettingsPage 控制
           entering / leaving / hidden 显隐动画（Vue 不会动容器自身的 class）。 -->
      <section id="settings-screen" class="settings-screen hidden" aria-label="设置"></section>

      <!-- P3：统计屏内容全部由 Vue 渲染（islands/StatsScreen.vue），直接挂载到本元素上。
           必须挂在 #stats-screen 本身而不是内部再套一层 div —— .stats-screen 是
           display:grid（280px 侧栏 + 1fr 主区），组件的多根节点必须成为它的直接网格项，
           否则 grid 只认到一个普通 div，侧栏拿不到高度约束，overflow 也不生效。
           外层容器仍由 legacy 的 openStatsPage / closeStatsPage 控制
           entering / leaving / hidden 显隐动画（Vue 不会动容器自身的 class）。 -->
      <section id="stats-screen" class="stats-screen hidden" aria-label="统计信息"></section>
    </main>
  </div>

  <div id="confirm-modal" class="modal hidden">
    <div class="modal-card">
      <h2>执行扫描？</h2>
      <p id="confirm-path"></p>
      <div class="modal-actions">
        <button id="cancel-scan" class="ghost-btn">取消</button>
        <button id="confirm-scan" class="primary-btn">开始扫描</button>
      </div>
    </div>
  </div>

  <div id="export-confirm-modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="export-confirm-title">导出分类？</h2>
      <p id="export-confirm-text"></p>
      <div class="modal-actions">
        <button id="cancel-export" class="ghost-btn">取消</button>
        <button id="confirm-export" class="primary-btn">确认导出</button>
      </div>
    </div>
  </div>

  <div id="input-modal" class="modal hidden">
    <div class="modal-card input-modal-card">
      <h2 id="input-modal-title">输入内容</h2>
      <p id="input-modal-message"></p>
      <input id="input-modal-input" class="modal-input hidden" />
      <textarea id="input-modal-textarea" class="modal-textarea hidden"></textarea>
      <div class="modal-actions">
        <button id="input-modal-cancel" class="ghost-btn">取消</button>
        <button id="input-modal-confirm" class="primary-btn">确认</button>
      </div>
    </div>
  </div>

  <div id="exif-pop" class="exif-pop hidden"></div>

  <div id="vue-lightbox" aria-label="灯箱（Vue）"></div>
  <div id="lightbox" class="lightbox hidden">
    <button id="lightbox-close" class="lightbox-close" title="关闭">×</button>
    <div id="lightbox-stage" class="lightbox-stage">
      <img id="lightbox-img" class="lightbox-img" alt="" />
      <div id="lightbox-compare" class="lightbox-compare hidden">
        <div class="compare-pane" data-compare-pane="0">
          <img id="compare-img-a" class="compare-img" alt="" />
          <div id="compare-info-a" class="compare-info hidden" data-compare-info="0">
            <div class="compare-info-head" data-compare-info-head="0">
              <span>左图参数</span>
              <button class="compare-info-close" type="button" data-compare-info-close="0" title="关闭参数">×</button>
            </div>
            <div class="compare-info-body" data-compare-info-body="0"></div>
          </div>
        </div>
        <div class="compare-pane" data-compare-pane="1">
          <img id="compare-img-b" class="compare-img" alt="" />
          <div id="compare-info-b" class="compare-info hidden" data-compare-info="1">
            <div class="compare-info-head" data-compare-info-head="1">
              <span>右图参数</span>
              <button class="compare-info-close" type="button" data-compare-info-close="1" title="关闭参数">×</button>
            </div>
            <div class="compare-info-body" data-compare-info-body="1"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="lightbox-info" class="lightbox-info">
      <div id="lightbox-info-head" class="lightbox-info-head">
        <span>照片参数</span>
        <button id="lightbox-info-details-toggle" class="lightbox-info-head-btn" title="折叠详细参数" aria-expanded="true" aria-label="折叠详细参数">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>
        <button id="lightbox-info-close" class="lightbox-info-close" title="关闭参数">×</button>
      </div>
      <div id="lightbox-info-body"></div>
      <div class="lightbox-info-resize lightbox-info-resize-n" data-lightbox-info-resize="n"></div>
      <div class="lightbox-info-resize lightbox-info-resize-e" data-lightbox-info-resize="e"></div>
      <div class="lightbox-info-resize lightbox-info-resize-s" data-lightbox-info-resize="s"></div>
      <div class="lightbox-info-resize lightbox-info-resize-w" data-lightbox-info-resize="w"></div>
      <div class="lightbox-info-resize lightbox-info-resize-ne" data-lightbox-info-resize="ne"></div>
      <div class="lightbox-info-resize lightbox-info-resize-se" data-lightbox-info-resize="se"></div>
      <div class="lightbox-info-resize lightbox-info-resize-sw" data-lightbox-info-resize="sw"></div>
      <div class="lightbox-info-resize lightbox-info-resize-nw" data-lightbox-info-resize="nw"></div>
    </div>
    <div class="lightbox-toolbar">
      <button id="lightbox-prev" class="icon-btn lightbox-nav-btn" title="上一张" aria-label="上一张">‹</button>
      <div class="lightbox-controls">
        <button id="lightbox-zoom-out" class="icon-btn" title="缩小">−</button>
        <input id="lightbox-zoom" class="lightbox-readout zoom-input" value="1.00×" title="输入放大倍率" />
        <button id="lightbox-zoom-in" class="icon-btn" title="放大">+</button>
        <button id="lightbox-info-toggle" class="icon-btn lightbox-info-toggle active" title="隐藏参数" aria-pressed="true">i</button>
        <div class="toolbar-divider"></div>
        <div id="lightbox-apsc-focal" class="lightbox-readout hidden">APS-C --</div>
        <div id="lightbox-focal" class="lightbox-readout">等效 --</div>
      </div>
      <div id="compare-toolbar" class="compare-toolbar hidden">
        <div id="compare-zoom-a" class="compare-zoom-readout">左 1.00×</div>
        <button id="compare-lock" class="compare-lock active" type="button" title="锁定同步" aria-pressed="true">锁</button>
        <button id="compare-info-toggle" class="icon-btn compare-info-toggle" type="button" title="显示参数" aria-pressed="false">i</button>
        <div id="compare-zoom-b" class="compare-zoom-readout">右 1.00×</div>
      </div>
      <button id="lightbox-next" class="icon-btn lightbox-nav-btn" title="下一张" aria-label="下一张">›</button>
    </div>
  </div>

  <!--
    加载顺序约定（迁移期请勿调整）：
    1) Vanilla 工具模块（quick_edit_*/pic_modification/raw_edit/source_conflicts/batch_*）先加载，建立基础能力
    2) vue/picscanner-vue.js 必须早于 app_core.js：Vue 侧在模块求值期建立 window.PicScannerVue / Pinia；
       但此时 window.PS 尚不存在（PS 由 app_core.js 定义），所以 main.js 内的早期 sync 是 no-op
       （被 if (!PS) return 守卫吞掉）。真正的同步发生在 app_core.js 定义 window.PS 之后：
       它主动调用 window.PicScannerVue.resyncToLegacyPS()，把 Vue 包（constants.js / bridge）中的
       权威常量与 bridgeCall 写回 window.PS，双向桥接在此处真正生效。若反序，app_core 将无法调用该方法。
    3) app_core.js → app_gallery.js → app_lightbox.js → app_modules.js → app.js 为 Vanilla 状态机与业务总线，必须在 Vue 之后
  -->
  <!-- P5-3：worker 源已改为 vite 构建产物（构建时内联 pixel 共享模块，
       并被变换为「源码字符串赋值」文件；?v= 由构建自动盖章）。 -->
  <script src="assets/vue/quick-edit-worker.js?v=1788718234063"></script>
  <script src="assets/quick_edit_geometry.js?v=frame-axis-space-20260819-1"></script>
  <script src="assets/pic_modification.js?v=settings-alt-exif-20260703-1"></script>
  <script src="assets/raw_edit.js?v=edit-stages-20260717-3"></script>
  <script src="assets/source_conflicts.js?v=source-id-discovery-20260716-1"></script>
  <script src="assets/batch_renderer.js?v=edit-stages-20260717-3"></script>
  <script src="assets/batch_processing.js?v=batch-edit-tabs-20260717-1"></script>
  <script src="assets/batch_selection.js?v=batch-edit-tabs-20260717-1"></script>
    <script src="mock-bridge.js"></script>
<script src="assets/vue/picscanner-vue.js?v=1788718233468"></script>
  <script src="assets/app_core.js?v=plugins-20260901-1"></script>
  <script src="assets/app_gallery.js?v=p4-engine-out-20260907"></script>
  <script src="assets/app_lightbox.js?v=p4-engine-out-20260907"></script>
  <script src="assets/app_modules.js?v=modules-20260723-2"></script>
  <script src="assets/collections.js?v=fix6-20260901"></script>
  <script src="assets/app.js?v=p4-engine-out-20260907"></script>
</body>
</html>
